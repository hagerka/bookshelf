name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular Project
        run: npx ng build --base-href /bookshelf/

      - name: Create 404 fallback for Angular Router
        run: cp dist/bookshelf/browser/index.html dist/bookshelf/browser/404.html

      - name: Setup Pages configuration
        uses: actions/configure-pages@v4

      - name: Upload production build
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/bookshelf/browser'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
